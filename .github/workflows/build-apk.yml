name: Build Android launcher APK

on:
  push:
    branches: [claude/telegram-music-bot-dpp4f8, main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/afienoto-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: afienoto-launcher-apk
          path: android/app/build/outputs/apk/debug/afienoto-launcher.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android launcher (latest)
          body: |
            Aplicație minimă Android care deschide botul de Telegram.
            Instalezi APK-ul manual (sideload) pe telefon.

            Notă: înainte de a folosi acest APK, setează `botUsername` în
            `android/gradle.properties` cu username-ul real al botului tău
            (cel ales la @BotFather), altfel butonul nu știe ce bot să deschidă.
          files: android/app/build/outputs/apk/debug/afienoto-launcher.apk
